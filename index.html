<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Clean Sweep Squad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: bright "cadet academy" — playful camo ground, colorful squad cards, mission board, PX store, earned patches */
:root{
  --bg:#f2f6ff; --panel:#ffffff; --ink:#1d2a4a; --muted:#5b6788; --line:#d9e1f2;
  --camo1:#c9f0e3; --camo2:#e6dcff; --camo3:#ffe0cc;
  --accent:#ff6b4a; --gold:#f5b700; --good:#14a37f;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Fredoka",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121831; --panel:#1c2445; --ink:#eef2ff; --muted:#a6b0d4; --line:#2e3864;
  --camo1:#163a3a; --camo2:#2a2456; --camo3:#3a2a2a; --accent:#ff8a6e; --gold:#ffc93c; --good:#3ccfa5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121831; --panel:#1c2445; --ink:#eef2ff; --muted:#a6b0d4; --line:#2e3864;
  --camo1:#163a3a; --camo2:#2a2456; --camo3:#3a2a2a; --accent:#ff8a6e; --gold:#ffc93c; --good:#3ccfa5; color-scheme:dark}
*{box-sizing:border-box}
body{font-family:var(--body);font-size:16px;line-height:1.4;color:var(--ink);background:var(--bg);
  background-image:
   radial-gradient(60px 40px at 10% 8%,var(--camo1) 98%,transparent),
   radial-gradient(90px 50px at 85% 4%,var(--camo2) 98%,transparent),
   radial-gradient(70px 45px at 95% 30%,var(--camo3) 98%,transparent),
   radial-gradient(80px 55px at 4% 40%,var(--camo2) 98%,transparent),
   radial-gradient(100px 50px at 50% 60%,var(--camo1) 98%,transparent),
   radial-gradient(70px 40px at 92% 75%,var(--camo1) 98%,transparent),
   radial-gradient(90px 60px at 8% 88%,var(--camo3) 98%,transparent);
  background-size:620px 620px;background-attachment:fixed}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,8vw,3.1rem);line-height:.95;margin:0;color:var(--ink);text-wrap:balance}
h1 span{color:var(--accent)}
.sub{font-weight:600;color:var(--muted);margin:4px 0 0;font-size:.95rem}
.toggle{font:inherit;font-weight:600;font-size:.9rem;border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 14px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel);padding:6px;border-radius:18px;border:2px solid var(--line)}
nav button{font-family:var(--display);font-size:1.1rem;letter-spacing:.02em;border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:12px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;color:var(--muted);margin:0}
section{display:flex;flex-direction:column;gap:12px}
/* Squad strip */
.squad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:var(--panel);border:3px solid var(--kid);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center}
.mini .em{width:40px;height:40px;border-radius:50%;background:var(--kid);display:grid;place-items:center;color:#fff}
.mini .em svg{width:24px;height:24px}
.mini .n{font-family:var(--display);font-size:1.15rem;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .r{font-size:.82rem;font-weight:600;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s{font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.star{color:var(--gold)}
/* Mission of the day */
.motd{position:relative;border:0;border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;font:inherit;color:#fff;background:linear-gradient(135deg,var(--accent),#f5487f);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.motd .eyebrow{color:rgba(255,255,255,.85)}
.motd .t{font-family:var(--display);font-size:1.45rem;line-height:1.1}
.motd small{font-weight:600}
.x2{font-family:var(--display);font-size:2rem;background:#fff;color:var(--accent);border-radius:50%;width:64px;height:64px;display:grid;place-items:center;flex:none;transform:rotate(-8deg)}
/* Grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--ink);font:inherit;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.card .t{font-weight:600;font-size:1.05rem;line-height:1.2}
.pill{align-self:flex-start;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--camo1);color:var(--ink);font-variant-numeric:tabular-nums}
.pill.gold{background:var(--gold);color:#3a2a00}
.del{align-self:flex-end;font-size:.82rem;font-weight:700;color:var(--accent);cursor:pointer}
/* Squad view */
.cadet{background:var(--panel);border:3px solid var(--kid);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cadet .top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.big-em{width:72px;height:72px;border-radius:50%;background:var(--kid);display:grid;place-items:center;color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.big-em svg{width:42px;height:42px}
.cadet h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1}
.rankline{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.ins{display:inline-flex;gap:2px;color:var(--gold)}
.ins svg{width:16px;height:16px}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--kid);border-radius:7px;transition:width .5s}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;margin-top:4px}
.meta b{color:var(--ink)}
.patches{display:flex;gap:8px;flex-wrap:wrap}
.patch{display:flex;flex-direction:column;align-items:center;gap:3px;width:68px;text-align:center;font-size:.7rem;font-weight:600;color:var(--muted);line-height:1.1}
.patch i{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-style:normal;border:3px dashed var(--line);color:var(--line)}
.patch i svg{width:24px;height:24px}
.patch.on i{border:3px solid var(--ink);background:var(--gold);color:var(--ink);transform:rotate(-4deg)}
.patch.on{color:var(--ink)}
.edit{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edit input[type=text]{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;flex:1 1 140px;min-width:0}
.swatches,.emblems{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.emb{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.emb svg{width:20px;height:20px}
.emb[aria-pressed="true"]{border-color:var(--ink);background:var(--camo1)}
/* Log */
.log{list-style:none;margin:0;padding:0;background:var(--panel);border-radius:16px;border:2px solid var(--line)}
.log li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.95rem}
.log li:last-child{border-bottom:0}
.log li span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.plus{color:var(--good)} .minus{color:var(--accent)}
.empty{color:var(--muted);font-style:italic;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.addform{display:flex;gap:8px;flex-wrap:wrap}
.addform input{font:inherit;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px;min-width:0}
.addform input[type=text]{flex:1 1 180px}
.addform input[type=number]{width:90px}
.btn{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;border:0;background:var(--ink);color:var(--panel);border-radius:12px;padding:10px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.warn{background:var(--accent);color:#fff}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,40,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:780px;border-radius:24px 24px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1;text-wrap:balance}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.who button{font:inherit;font-weight:700;font-size:1.05rem;padding:14px 6px;border-radius:16px;border:3px solid var(--kid);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.who button .em{width:40px;height:40px;border-radius:50%;background:var(--kid);display:grid;place-items:center;color:#fff}
.who button .em svg{width:24px;height:24px}
.who button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who button:disabled{opacity:.4;cursor:not-allowed}
/* Celebrations */
.promo{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(15,20,40,.7);padding:24px}
.promo .box{background:var(--panel);border:5px solid var(--gold);border-radius:26px;padding:28px 22px;text-align:center;max-width:380px;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-6deg)}}
.promo .big{font-family:var(--display);font-size:2.3rem;line-height:1;color:var(--accent)}
.vstage{width:min(320px,74vw);aspect-ratio:3/2;background:var(--camo1);border-radius:20px;overflow:hidden}
.vstage svg{width:100%;height:100%;display:block}
.vstage svg *{transform-box:fill-box;transform-origin:center}
.vline{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;font-size:1.1rem}
.vline .em{width:30px;height:30px;border-radius:50%;background:var(--kid);display:inline-grid;place-items:center;color:#fff}
.vline .em svg{width:18px;height:18px}
.vstars{font-family:var(--display);font-size:2rem;color:var(--gold);font-variant-numeric:tabular-nums}
@keyframes vdrop{from{transform:translateY(-130px);opacity:0}60%{transform:translateY(6px);opacity:1}}
@keyframes vslideL{from{transform:translateX(-240px)}}
@keyframes vslideR{from{transform:translateX(240px)}}
@keyframes vpop{0%{transform:scale(0)}70%{transform:scale(1.35)}}
@keyframes vfade{from{opacity:1}to{opacity:0}}
@keyframes vrise{from{transform:translateY(40px);opacity:1}to{transform:translateY(-80px);opacity:0}}
@keyframes vblanket{from{transform:translate(80px,-60px) rotate(22deg)}}
@keyframes vtoss{0%{transform:translate(-175px,30px) rotate(-120deg)}50%{transform:translate(-85px,-80px) rotate(-40deg)}}
@keyframes vlid{0%,25%{transform:rotate(0)}40%,70%{transform:rotate(-75deg)}}
@keyframes vwiggle{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-28deg)}40%,80%{transform:rotate(28deg)}}
@keyframes vflip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}}
@keyframes vbounce{0%{transform:translateY(-120px) scale(.6)}50%{transform:translateY(0) scale(1.1)}70%{transform:translateY(-22px)}}
@keyframes vfly{from{transform:translate(var(--fx),var(--fy)) rotate(var(--fr,0deg))}}
@keyframes vrub{0%,100%{transform:translate(0,0)}15%,55%{transform:translate(-12px,-10px)}30%,70%{transform:translate(10px,-4px)}45%,85%{transform:translate(-6px,10px)}}
@keyframes vstairs{0%{transform:translate(176px,-96px)}18%{transform:translate(132px,-72px)}36%{transform:translate(88px,-48px)}54%{transform:translate(44px,-24px)}72%,100%{transform:translate(0,0)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 20px;border-radius:999px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.note{font-size:.9rem;color:var(--muted);margin:0}
[hidden]{display:none!important}
.pindots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.pindots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);transition:background .1s}
.pindots i.on{background:var(--ink)}
.pindots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#pinMsg.err{color:var(--accent);font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;width:100%;align-self:center}
.keypad button{font-family:var(--display);font-size:1.7rem;padding:12px 0;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.keypad button:active{background:var(--camo1)}
.pbar .btn.ghost{background:var(--panel);color:var(--accent);border:2px solid var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 6px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[data-who=""]{padding-left:14px}
.chip .em{width:26px;height:26px;border-radius:50%;background:var(--kid);display:grid;place-items:center;color:#fff}
.chip .em svg{width:16px;height:16px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.area{display:flex;flex-direction:column;gap:10px}
.areah{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:1.5rem}
.areah small{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--muted)}
.aic{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--panel);display:grid;place-items:center}
.aic svg{width:20px;height:20px}
.card.off{opacity:.5;box-shadow:none;border-style:dashed}
.card.off .t{text-decoration:line-through}
.cardctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.cardctl .del{align-self:auto}
.tgl{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted)}
.tgl i{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tgl[aria-checked="true"] i{background:var(--good)}
.tgl[aria-checked="true"] i::after{transform:translateX(16px)}
.tgl[aria-checked="true"] b{color:var(--good)}
.card.off .tgl{opacity:1}
.card.mine{border-color:var(--kid);box-shadow:0 4px 0 var(--kid)}
.cardfoot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cardfoot .pill{align-self:auto}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;padding:2px 9px 2px 3px;border-radius:999px;background:var(--kid);color:#fff}
.tag .em{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.tag .em svg{width:12px;height:12px}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--camo3);border:2px dashed var(--accent);border-radius:16px;padding:10px 14px}
.pbar .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff}
.pbar .pi{width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.kidvid{width:100%;max-width:340px;aspect-ratio:9/16;border-radius:18px;background:#000;display:block;align-self:center}
.sheet video{width:100%;max-height:62vh;border-radius:16px;background:#000;display:block}
.sheet{max-height:92vh;overflow-y:auto}
.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.editgrid label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.editgrid input,.editgrid select,.addform select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.about{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.about h2{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.05;margin:0;text-wrap:balance}
.about p{margin:0;max-width:62ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.steps b.num{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.2rem;font-weight:400}
.ladder{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.ladder li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--bg);font-weight:600}
.ladder li small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.phow{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.phow div{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center}
.phow i{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:var(--ink);border:3px solid var(--ink);transform:rotate(-4deg)}
.phow i svg{width:24px;height:24px}
.rules li{margin-bottom:6px}
/* Sync + logins */
#gate{position:fixed;inset:0;z-index:15;overflow-y:auto;background:var(--bg);background-image:inherit}
.gatebox{max-width:560px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 60px;display:flex;flex-direction:column;gap:18px}
.gatebox .who{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.gatebox .who button small{font-size:.75rem;color:var(--muted);font-weight:600}
.approvals{border-color:var(--gold);border-width:3px}
.approvals .log li{align-items:center;flex-wrap:wrap}
.approvals .log li>span:first-child{font-variant-numeric:normal;font-weight:500;white-space:normal}
.apbtns{display:flex;gap:6px}
.apbtns .btn{padding:7px 14px;font-size:.95rem}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow small{color:var(--muted);font-weight:500}
.status{font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--good);color:#fff}
.status.wait{background:var(--gold);color:#3a2a00}

</div>

<div id="sheetRoot"></div>
<canvas id="fx"></canvas>

<script>
const ICONS={
 book:'<path d="M2.5 5.5c3.2-1.2 6.2-.9 8.8 1V20c-2.6-1.7-5.6-2-8.8-.9zM21.5 5.5c-3.2-1.2-6.2-.9-8.8 1V20c2.6-1.7 5.6-2 8.8-.9z" fill="currentColor"/>',
 soccer:'<circle cx="12" cy="12" r="10.5" fill="currentColor"/><g style="fill:var(--kid,#1d2a4a);stroke:var(--kid,#1d2a4a)" stroke-width="1.4" stroke-linejoin="round"><path d="M12 8l3.8 2.8-1.5 4.5H9.7l-1.5-4.5z"/><path d="M10 2l4 0 .6 2.2L12 5.4 9.4 4.2zM20.6 8.3l1.3 3.8-1.8 1.4-2.3-1.6.6-2.7zM18.3 19.5l-3.3 2.3-1.6-1.3 1-2.7 2.8-.1zM5.7 19.5l3.3 2.3 1.6-1.3-1-2.7-2.8-.1zM3.4 8.3L2.1 12.1l1.8 1.4 2.3-1.6-.6-2.7z"/><path d="M12 8V5.4M15.8 10.8l2-1M14.3 15.3l1 2.4M9.7 15.3l-1 2.4M8.2 10.8l-2-1" fill="none"/></g>',
 mic:'<rect x="8.5" y="2" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21.5M8 21.5h8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 star:'<path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="currentColor"/>',
 heart:'<path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3.1A4.6 4.6 0 0 1 20 10c0 5.8-8 11-8 11z" fill="currentColor"/>',
 bolt:'<path d="M13.5 2L4 14h6.5L9.5 22 20 9.5h-6.6z" fill="currentColor"/>',
 crown:'<path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z" fill="currentColor"/>',
 shield:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="currentColor"/>',
 moon:'<path d="M20 15.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 10.5 12.5z" fill="currentColor"/>',
 flower:'<g fill="currentColor"><circle cx="12" cy="6" r="4"/><circle cx="18" cy="12" r="4"/><circle cx="12" cy="18" r="4"/><circle cx="6" cy="12" r="4"/></g><circle cx="12" cy="12" r="3" fill="#fff"/>',
 paw:'<g fill="currentColor"><ellipse cx="12" cy="16" rx="5" ry="4.5"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.5" r="2.2"/><circle cx="14" cy="6.5" r="2.2"/><circle cx="18" cy="10" r="2.2"/></g>',
 check:'<path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
 bag:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>',
 fire:'<path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-3 1.5-4 2-6 .8 1.5 1.5 2 2.3 2C11.8 6 12 4 12 2z" fill="currentColor"/>',
 up:'<path d="M12 3l8 9h-5v9H9v-9H4z" fill="currentColor"/>',
 down:'<path d="M12 21l8-9h-5V3H9v9H4z" fill="currentColor"/>',
 sun:'<circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
 medal:'<g fill="currentColor"><path d="M7 2h4l1 5-3 2zM17 2h-4l-1 5 3 2z"/><circle cx="12" cy="15" r="6"/></g>'
};
const svg=(k,vb="0 0 24 24")=>`<svg viewBox="${vb}" aria-hidden="true">${ICONS[k]}</svg>`;
const COLORS=["#ff6b6b","#f5487f","#8b5cf6","#3b82f6","#12b5a5","#f59e0b"];
const EMBLEMS=["mic","book","soccer","star","heart","bolt","crown","shield","moon","flower","paw"];
// [XP needed, rank name, stars on insignia]
const RANKS=[[0,"Recruit",0],[40,"Cadet",1],[100,"Private",1],[180,"Corporal",2],[280,"Sergeant",2],
 [400,"Lieutenant",3],[550,"Captain",3],[730,"Major",4],[950,"Colonel",4],[1200,"General",5],[1500,"Five-Star General",5]];
const PATCHES=[
 ["first","First Mission","check",k=>k.missions>=1],
 ["five","High Five","star",k=>k.missions>=5],
 ["x2","Double Duty","bolt",k=>k.x2>=1],
 ["shop","First Reward","bag",k=>k.bought>=1],
 ["hundred","100 Club","fire",k=>k.xp>=100],
 ["iron","25 Missions","medal",k=>k.missions>=25]
];
const PATCH_HOW={first:"Finish your very first mission.",five:"Finish 5 missions.",x2:"Finish a Special Mission on its double-star day.",shop:"Cash in your first reward at the store.",hundred:"Earn 100 stars total.",iron:"Finish 25 missions. That's a serious cadet."};
const DEFAULT={
 kids:[
  {id:"a",name:"Isabella",color:COLORS[2],emblem:"mic"},
  {id:"b",name:"Margaret",color:COLORS[4],emblem:"book"},
  {id:"c",name:"William",color:COLORS[3],emblem:"soccer"}
 ].map(k=>({...k,xp:0,stars:0,missions:0,x2:0,bought:0})),
 chores:[["Make your bed",5],["Set the table",5],["Clear the table",5],["Unload the dishwasher",10],["Take out the trash",10],
  ["Fold a load of laundry",15],["Vacuum the living room",15],["Clean the bathroom sink",15],["Room inspection ready",20],
  ["Help Dad in the garage",20],["Rake leaves",25],["Shovel the driveway",30]].map((c,i)=>({id:"c"+i,name:c[0],xp:c[1]})),
 rewards:[["30 min of screen time",40],["Stay up 30 min late",50],["Pick tonight's dinner",60],["Pick family movie night",70],
  ["Skip one chore (not trash)",80],["$5 cash",120],["One-on-one date with Mom or Dad",150]].map((r,i)=>({id:"r"+i,name:r[0],cost:r[1]})),
 log:[],done:{}
};
let S;try{S=JSON.parse(localStorage.getItem("cleansweep"))}catch(e){}
if(!S||!S.kids)S=structuredClone(DEFAULT);
// Real names, applied once to devices still showing the placeholders
if(!(S.names>=1)){const NM={a:"Isabella",b:"Margaret",c:"William"},PH=["Oldest","Middle","Youngest"];S.kids.forEach(k=>{if(PH.includes(k.name)&&NM[k.id]){k.name=NM[k.id];S.log.forEach(l=>{if(l.kid===k.id)l.text=l.text.replace(/^(Oldest|Middle|Youngest)/,k.name)})}if(k.id==="c"&&k.emblem==="heart"&&k.color===COLORS[1]){k.emblem="shield";k.color=COLORS[3]}});S.names=1;try{localStorage.setItem("cleansweep",JSON.stringify(S))}catch(e){}}
if(!(S.names>=2)){const EM={a:"mic",b:"book",c:"soccer"};S.kids.forEach(k=>{if(EM[k.id])k.emblem=EM[k.id]});S.names=2;try{localStorage.setItem("cleansweep",JSON.stringify(S))}catch(e){}}
// v2 house missions, added once (so a parent's later removals stick)
if(!(S.v>=3)){[["Mow the yard",30],["Tidy the living room",15],["Tidy the dining room",15],["Clean the downstairs toilet",20],["Clean the upstairs toilet",20],["Clean the door knobs",10],["Dry mop downstairs",15],["Wipe the stairs",15]].forEach(([n,x],i)=>{if(!S.chores.some(c=>c.name===n))S.chores.push({id:"h2_"+i,name:n,xp:x})});S.v=3;try{localStorage.setItem("cleansweep",JSON.stringify(S))}catch(e){}}
const AREAS=[["Upstairs","up"],["Downstairs","down"],["Outside","sun"]];
const guessArea=n=>{n=n.toLowerCase();if(/upstairs|bed|bathroom|room inspection|laundry/.test(n))return"Upstairs";if(/outside|yard|mow|rake|leaves|shovel|driveway|garage|trash/.test(n))return"Outside";return"Downstairs"};
const fixChores=()=>S.chores.forEach(c=>{if(!c.area)c.area=guessArea(c.name);if(c.kid===undefined)c.kid=null});fixChores();
const LOCAL=structuredClone(S);S.pending=[];S.settings={approve:true};
let parent=false,tab="missions",who=null,editing=null;
const isParent=()=>!!(me&&me.role==="parent");
let saveT=null;const save=()=>{clearTimeout(saveT);saveT=setTimeout(saveConfig,250)};
const today=()=>{const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Indiana/Indianapolis",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t).value;return g("year")+"-"+g("month")+"-"+g("day")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rankOf=xp=>{let i=0;RANKS.forEach((r,j)=>{if(xp>=r[0])i=j});return i};
const kidStyle=k=>`style="--kid:${k.color}"`;
const insignia=i=>`<span class="ins">${Array(RANKS[i][2]).fill(svg("star")).join("")}</span>`;
function motd(){const on=S.chores.filter(c=>!c.off);let h=0;for(const ch of today())h=(h*31+ch.charCodeAt(0))>>>0;return on.length?on[h%on.length]:null}
const doneKey=(kid,ch)=>today()+"|"+kid+"|"+ch;

function strip(){
  document.getElementById("strip").innerHTML=S.kids.map(k=>`<div class="mini" ${kidStyle(k)}><span class="em">${svg(k.emblem)}</span><span class="n">${esc(k.name)}</span><span class="r">${RANKS[rankOf(k.xp)][1]}</span><span class="s"><span class="star">★</span> ${k.stars}</span></div>`).join("");
}
function render(){
  if(!me)return;
  header();
  strip();
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.getElementById("helpBtn").setAttribute("aria-pressed",tab==="about");
  document.getElementById("pbar").hidden=!parent;
  const v=document.getElementById("view");
  if(tab==="about"){
    v.innerHTML=`<section>
     <div class="about"><p class="eyebrow">Welcome, Cadet</p><h2>Here's how the Squad works</h2>
      <p>Chores still have to get done. Now they count for something. Every job you finish earns stars, and stars get you promoted and buy you real rewards.</p>
      <video class="kidvid" src="kids-how-to-play.mp4" controls playsinline preload="metadata"></video>
      <p class="note">Watch the video first, then read the rest below.</p></div>
     <div class="about"><h2>Running a mission</h2><ol class="steps">
      <li><b class="num">1</b><span><b>Do the job for real.</b> All the way, done right. A bed with the blanket thrown on top doesn't count.</span></li>
      <li><b class="num">2</b><span><b>Tap it on the Mission Board.</b> Find the chore you finished and tap it.</span></li>
      <li><b class="num">3</b><span><b>Tap your name.</b> Mom or Dad gets a note to check your work. When they approve it, the stars are yours. Watch for confetti.</span></li>
     </ol>
     <p>You can get stars for each mission <b>once a day</b>. Making your bed five times in a row won't work. Nice try, though.</p></div>
     <div class="about"><h2>The Special Mission ×2</h2><p>The big colorful mission at the top of the board pays <b>double stars</b>. It changes every day, so check it each morning. Finishing one earns you the Double Duty patch, too.</p></div>
     <div class="about"><h2>Climbing the ranks</h2><p>Every star you ever earn counts toward your next promotion. When you hit a new rank, the whole screen celebrates. How high can you go?</p>
      <ul class="ladder">${RANKS.map(r=>`<li><span>${r[1]}</span><small>${r[0]} ★</small></li>`).join("")}</ul></div>
     <div class="about"><h2>Collect your patches</h2><p>Patches are badges you keep forever. They show up on your card in the Squad tab.</p>
      <div class="phow">${PATCHES.map(p=>`<div><i>${svg(p[2])}</i><span><b>${p[1]}</b><br><small>${PATCH_HOW[p[0]]}</small></span></div>`).join("")}</div></div>
     <div class="about"><h2>The Squad Store</h2><p>Spend your stars on rewards like screen time, picking dinner, or a date with Mom or Dad. <b>Mom or Dad approves every reward</b> before the stars come off. And don't worry: spending stars never lowers your rank. Your promotions are yours to keep.</p></div>
     <div class="about"><h2>Squad rules</h2><ul class="steps rules" style="gap:6px">
      <li><b class="num" style="background:var(--good)">${svg("check")}</b><span><b>Honesty first.</b> Only tap missions you really finished. Mom and Dad can see the log and undo anything.</span></li>
      <li><b class="num" style="background:var(--good)">${svg("check")}</b><span><b>Done means done right.</b> If a parent says it needs another try, finish it, then claim it.</span></li>
      <li><b class="num" style="background:var(--good)">${svg("check")}</b><span><b>Cheer each other on.</b> We're one squad. When your brother or sister gets promoted, that's a win for the whole team.</span></li>
      <li><b class="num" style="background:var(--good)">${svg("check")}</b><span><b>Parents have the final say.</b> Questions about stars, rewards or missions go to Mom or Dad.</span></li>
     </ul></div>
     <button class="btn" style="align-self:flex-start" data-go="missions">Got it. Show me the missions!</button>
    </section>`;
  }else if(tab==="missions"){
    const m=motd(),vis=S.chores.filter(c=>(parent||!c.off)&&(!who||!c.kid||c.kid===who));
    const kidOf=id=>id&&S.kids.find(k=>k.id===id);
    const card=c=>{const k=kidOf(c.kid);return `<button class="card${k?" mine":""}${c.off?" off":""}" data-chore="${c.id}" ${k?kidStyle(k):""}><span class="t">${esc(c.name)}</span><span class="cardfoot"><span class="pill">+${c.xp} ★</span>${me.role==="kid"&&S.done[doneKey(me.id,c.id)]?(S.done[doneKey(me.id,c.id)]==="p"?`<span class="status wait">Waiting</span>`:`<span class="status">Done ✓</span>`):""}${k?`<span class="tag"><span class="em">${svg(k.emblem)}</span>${esc(k.name)}</span>`:""}</span>${parent?`<span class="cardctl"><span class="tgl" data-toggle="${c.id}" role="switch" aria-checked="${!c.off}" aria-label="Mission on or off"><i></i><b>${c.off?"Off":"On"}</b></span><span class="del" data-editchore="${c.id}" role="button">Edit</span></span>`:""}</button>`};
    v.innerHTML=`<section>
     ${pendingBox()}
     ${m&&vis.includes(m)?`<button class="motd" data-chore="${m.id}" data-x2="1"><div><p class="eyebrow">Today's special mission</p><div class="t">${esc(m.name)}</div><small>${m.xp*2} stars · double today only${kidOf(m.kid)?` · ${esc(kidOf(m.kid).name)}'s mission`:""}</small></div><span class="x2">×2</span></button>`:""}
     <div><p class="eyebrow" style="margin-bottom:8px">Show missions for</p><div class="chips"><button class="chip" data-who="" aria-pressed="${!who}">Everyone</button>${S.kids.map(k=>`<button class="chip" data-who="${k.id}" ${kidStyle(k)} aria-pressed="${who===k.id}"><span class="em">${svg(k.emblem)}</span>${esc(k.name)}</button>`).join("")}</div></div>
     ${AREAS.map(([a,ic])=>{const list=vis.filter(c=>c.area===a);return list.length?`<div class="area"><h3 class="areah"><span class="aic">${svg(ic)}</span>${a}<small>${list.length} mission${list.length>1?"s":""}</small></h3><div class="grid">${list.map(card).join("")}</div></div>`:""}).join("")}
     ${vis.length?"":`<p class="empty">No missions here yet.</p>`}
     ${parent?`<div class="about"><p class="eyebrow">Add a mission</p><form class="addform" id="addChore"><input id="cn" type="text" placeholder="Mission name" required><input id="cx" type="number" min="1" max="200" value="10" aria-label="Stars">
       <select id="ca" aria-label="Floor">${AREAS.map(([a])=>`<option>${a}</option>`).join("")}</select>
       <select id="ck" aria-label="Assigned to"><option value="">Anyone</option>${S.kids.map(k=>`<option value="${k.id}">${esc(k.name)} only</option>`).join("")}</select>
       <button class="btn">Add</button></form></div>`:""}
    </section>`;
  }else if(tab==="squad"){
    v.innerHTML=`<section>${S.kids.map(k=>{
      const i=rankOf(k.xp),cur=RANKS[i],nxt=RANKS[i+1];
      const pct=nxt?Math.round((k.xp-cur[0])/(nxt[0]-cur[0])*100):100;
      return `<div class="cadet" ${kidStyle(k)}>
       <div class="top"><div class="big-em">${svg(k.emblem)}</div><div style="min-width:0">
        <h3>${esc(k.name)}</h3>
        <div class="rankline">${insignia(i)}<span>${cur[1]}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="meta"><span><b>${k.xp}</b> total stars earned</span><span><b class="star">★ ${k.stars}</b> to spend</span><span>${nxt?`${nxt[0]-k.xp} more to ${nxt[1]}`:"Top rank!"}</span></div>
       </div></div>
       <div><p class="eyebrow" style="margin-bottom:6px">Patches</p><div class="patches">${PATCHES.map(p=>`<div class="patch ${p[3](k)?"on":""}"><i>${svg(p[2])}</i>${p[1]}</div>`).join("")}</div></div>
       ${parent?`<div class="edit"><input type="text" id="name-${k.id}" data-name="${k.id}" value="${esc(k.name)}" aria-label="Name">
         <div class="swatches">${COLORS.map(c=>`<button class="sw" style="background:${c}" data-color="${c}" data-kid="${k.id}" aria-label="Color" aria-pressed="${c===k.color}"></button>`).join("")}</div>
         <div class="emblems">${EMBLEMS.map(e=>`<button class="emb" data-emblem="${e}" data-kid="${k.id}" aria-label="${e}" aria-pressed="${e===k.emblem}">${svg(e)}</button>`).join("")}</div></div>`:""}
      </div>`}).join("")}
     <div class="row"><p class="eyebrow">Mission log</p>${parent&&S.log.length?`<button class="btn ghost" id="undo">Undo last</button>`:""}</div>
     ${S.log.length?`<ul class="log">${S.log.slice(0,25).map(l=>`<li><span>${esc(l.text)}</span><span class="${l.d>=0?"plus":"minus"}">${l.d>=0?"+":""}${l.d} ★</span></li>`).join("")}</ul>`:`<p class="empty">No missions yet. Who's going to be first?</p>`}
     ${parent?`<button class="btn ghost" id="reset" style="align-self:flex-start">Reset all stars…</button>`:""}
    </section>`;
  }else{
    v.innerHTML=`<section>
     <p class="eyebrow">Squad store · spend your stars</p>
     <div class="grid">${S.rewards.map(r=>`<button class="card" data-reward="${r.id}"><span class="t">${esc(r.name)}</span><span class="pill gold">★ ${r.cost}</span>${parent?`<span class="del" data-delreward="${r.id}" role="button">Remove</span>`:""}</button>`).join("")}</div>
     ${parent?`<p class="eyebrow">Add a reward</p><form class="addform" id="addReward"><input id="rn" type="text" placeholder="Reward" required><input id="rc" type="number" min="1" max="999" value="50" aria-label="Cost"><button class="btn">Add</button></form>`:""}
     <p class="note">Spending stars never lowers your rank. Every star you earn counts toward promotion forever.</p>
    </section>`;
  }
}
function editChore(id){
  const c=S.chores.find(c=>c.id===id);if(!c)return;editing=id;
  sheet(`<p class="eyebrow">Edit mission</p><h2>${esc(c.name)}</h2>
   <div class="editgrid"><label>Name<input id="en" type="text" value="${esc(c.name)}"></label>
   <label>Stars<input id="ex" type="number" min="1" max="200" value="${c.xp}"></label>
   <label>Floor<select id="ea">${AREAS.map(([a])=>`<option ${a===c.area?"selected":""}>${a}</option>`).join("")}</select></label>
   <label>Assigned to<select id="ek"><option value="">Anyone</option>${S.kids.map(k=>`<option value="${k.id}" ${k.id===c.kid?"selected":""}>${esc(k.name)} only</option>`).join("")}</select></label></div>
   <div class="addform"><button class="btn" id="saveChore">Save</button><button class="btn ghost" id="delChore">Remove mission</button><button class="btn ghost" data-close style="border-color:var(--line);color:var(--muted)">Cancel</button></div>`);
}
// ---------- Family sync: every device shares one scoreboard ----------
let TOKEN=null;try{TOKEN=localStorage.getItem("css_token")}catch(e){}
let me=null,REV=0,PINS={},ROSTER=[],waitRender=false;
const PARENT_LIST=[{id:"dad",name:"Dad",color:"#1d2a4a",emblem:"shield",role:"parent"},{id:"mom",name:"Mom",color:"#f5487f",emblem:"heart",role:"parent"}];
const people=()=>[...S.kids.map(k=>({id:k.id,name:k.name,color:k.color,emblem:k.emblem,role:"kid"})),...PARENT_LIST];
const pendingCost=kid=>(S.pending||[]).filter(p=>p.kid===kid&&p.type==="buy").reduce((a,p)=>a+p.cost,0);
function setToken(t){TOKEN=t;try{t?localStorage.setItem("css_token",t):localStorage.removeItem("css_token")}catch(e){}}
async function api(path,body){
  let r;
  try{r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:{"content-type":"application/json",...(TOKEN?{authorization:"Bearer "+TOKEN}:{})},body:body?JSON.stringify(body):undefined,cache:"no-store"})}
  catch(e){throw new Error("Can't reach the Squad. Check the Wi-Fi and try again.")}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&TOKEN&&!["login","setup"].includes(path)){signedOut();throw new Error("signed out")}
  if(!r.ok)throw Object.assign(new Error(j.error||"Something went wrong. Try again."),{status:r.status});
  return j;
}
function take(j){if(j.token)setToken(j.token);if(j.state){S=j.state;REV=j.rev;fixChores()}if(j.me)me=j.me;if(j.pins)PINS=j.pins}

async function act(type,data){
  try{const j=await api("act",{type,...(data||{})});const old=S;take(j);render();notice(old,true);return j}
  catch(e){if(e.message!=="signed out")toast(e.message);refresh(true);return null}
}

  if(!TOKEN||!me||(document.hidden&&!force))return;
  try{const j=await api("state"+(force?"":"?since="+REV));if(j.same)return;const old=S;take(j);
    if(typing()||busyScreen())waitRender=true;else render();notice(old,false)}catch(e){}
}

// Let a kid know when Mom or Dad approves (or sends back) one of their missions
function notice(old,mine){
  if(!old||!old.log||!me)return;
  const top=Math.max(0,...old.log.map(l=>l.id||0));
  const fresh=S.log.filter(l=>(l.id||0)>top).reverse();
  if(me.role==="kid"){
    const k=S.kids.find(k=>k.id===me.id),ok=old.kids.find(k=>k.id===me.id);if(!k||!ok)return;
    fresh.filter(l=>l.kid===me.id&&l.by&&l.by!==me.name).forEach(l=>{
      if(l.no)toast(`${l.by} says not yet: ${l.text.replace(/^[^:]+: /,"").replace(/ \(not yet\)$/,"")}`);
      else{toast(l.d>=0?`${l.by} approved it! +${l.d} ★`:`${l.by} approved: ${l.text.replace(/^.+ got: /,"")}`);burst(60,k.color)}
    });
    const next=cheers(k,rankOf(ok.xp),PATCHES.filter(p=>p[3](ok)).length);if(next&&!mine)next();
  }else if(!mine){
    const n=(S.pending||[]).length,o=(old.pending||[]).length;
    if(n>o)toast(n===1?"1 mission is waiting for your approval":`${n} missions are waiting for your approval`);
  }
}

async function buyIt(kidId,rewardId){

async function pinDone(v){
  if(pinMode==="login"){

 toilet:()=>`<rect x="112" y="34" width="76" height="46" rx="8" fill="#fff" ${O}/><path d="M96 86h108a54 30 0 0 1-108 0z" fill="#fff" ${O}/><path d="M128 124h44l-6 40h-32z" fill="#fff" ${O}/><ellipse cx="150" cy="88" rx="42" ry="8" fill="#bfe6ff"/>`+[120,140,160,180,150].map((x,i)=>`<circle cx="${x}" cy="90" r="${6+(i%3)*3}" fill="#bfe6ff" stroke="#3b82f6" stroke-width="2" ${A("vrise",1,.2+i*.2,"ease-out","opacity:0")}/>`).join("")+`<g ${A("vwiggle",1.2,.1,"ease-in-out","transform-origin:50% 100%")}><line x1="246" y1="60" x2="240" y2="140" stroke="#1d2a4a" stroke-width="5" stroke-linecap="round"/><ellipse cx="240" cy="150" rx="16" ry="12" fill="#12b5a5" ${O}/></g>${SPARKS(1.5)}`,
 knob:()=>`<rect x="90" y="14" width="120" height="186" rx="4" fill="#f59e0b" ${O}/><rect x="106" y="30" width="88" height="60" rx="4" fill="none" stroke="#1d2a4a" stroke-width="2" opacity=".4"/><rect x="106" y="110" width="88" height="74" rx="4" fill="none" stroke="#1d2a4a" stroke-width="2" opacity=".4"/><circle cx="190" cy="104" r="11" fill="#f5b700" ${O}/><rect x="196" y="102" width="30" height="24" rx="8" fill="#3b82f6" ${O} ${A("vrub",1.3,.1,"ease-in-out")}/>`+sp(176,86,1.4,12)+sp(206,92,1.55,9)+sp(186,124,1.7,8),

const vkind=n=>{n=n.toLowerCase();for(const[k,re] of [["bed",/bed/],["mow",/mow|lawn|grass/],["toilet",/toilet/],["mop",/mop/],["knob",/knob|door|handle/],["stairs",/stair/],["living",/living|couch|family room/],["dining",/dining/],["table",/table/],["dishes",/dish|plate/],["trash",/trash|garbage|recycl/],["laundry",/laundry|fold|clothes/],["vacuum",/vacuum|sweep|mop|floor/],["sink",/bath|sink|toilet|tub|mirror|wipe|wash/],["room",/room|toy|pick up|tidy/],["leaves",/leaf|leaves|rake|yard|mow/],["snow",/snow|shovel|driveway/],["garage",/garage|tool|fix|build|help/]])if(re.test(n))return k;return "trophy"};
const VCHEER=["Mission complete!","Nailed it!","Outstanding!","Squad hero!","Crushed it!"];
function victory(k,c,pts,x2,next,pending){
  const d=document.createElement("div");d.className="promo";
  d.innerHTML=`<div class="box" ${kidStyle(k)}><div class="vstage"><svg viewBox="0 0 300 200" aria-hidden="true">${VSCENES[vkind(c.name)]()}</svg></div>
   <div class="big">${VCHEER[Math.floor(Math.random()*VCHEER.length)]}</div>
   <div class="vline"><span class="em">${svg(k.emblem)}</span><b>${esc(k.name)}</b><span>${esc(c.name)}</span></div>
   <div class="vstars">+<span class="vc">0</span> ★${x2?" <small style='font-size:1rem;color:var(--accent)'>double!</small>":""}</div>${pending?`<p class="note" style="font-weight:700">Sent to Mom and Dad. Your stars land when they approve it.</p>`:""}
   <button class="btn">Awesome!</button></div>`;
  let closed=false;const close=()=>{if(closed)return;closed=true;d.remove();next&&next()};
  d.addEventListener("click",close);document.body.appendChild(d);burst(70,k.color);
  const el=d.querySelector(".vc"),t0=performance.now();
  (function count(now){const p=Math.min(1,(now-t0)/900);el.textContent=Math.round(pts*p);if(p<1&&!closed)requestAnimationFrame(count)})(t0);
  setTimeout(close,4200);
}
function award(kidId,choreId,pts,x2){claim(kidId,choreId,x2)}
function cheers(k,before,patchesBefore){
  const after=rankOf(k.xp),newPatch=PATCHES.filter(p=>p[3](k)).length>patchesBefore;
  if(after>before)return()=>celebrate(k,`${insignia(after)}`,`Promoted!`,`${esc(k.name)} is now ${RANKS[after][1]}`);
  if(newPatch){const p=PATCHES.filter(p=>p[3](k)).pop();return()=>celebrate(k,`<div class="big-em" style="background:var(--gold);color:var(--ink)">${svg(p[2])}</div>`,`New patch!`,`${esc(k.name)} earned “${p[1]}”`)}
  return null;
}
async function claim(kidId,choreId,x2){
  closeSheet();
  const k0=S.kids.find(k=>k.id===kidId);if(!k0)return;
  const before=rankOf(k0.xp),pb=PATCHES.filter(p=>p[3](k0)).length;
  const r=await act("claim",{kid:kidId,chore:choreId,x2:!!x2});if(!r)return;
  const res=r.result,k=S.kids.find(k=>k.id===kidId),c=S.chores.find(c=>c.id===choreId)||{name:"Mission"};
  victory(k,c,res.pts,res.x2,res.status==="pending"?null:cheers(k,before,pb),res.status==="pending");
}
function celebrate(k,icon,head,line){
  const d=document.createElement("div");d.className="promo";
  d.innerHTML=`<div class="box" ${kidStyle(k)}>${icon}<div class="big">${head}</div><div style="font-weight:700;font-size:1.2rem">${line}</div><button class="btn" style="margin-top:6px">Awesome!</button></div>`;
  d.addEventListener("click",()=>d.remove());document.body.appendChild(d);burst(150,k.color);
}
function buy(rewardId){
  const r=S.rewards.find(r=>r.id===rewardId);
  sheet(`<p class="eyebrow">Squad store</p><h2>${esc(r.name)} · ★ ${r.cost}</h2><p class="note">${isParent()?"Who's cashing in?":"Want to cash in? Tap your name."}</p>
   <div class="who">${S.kids.filter(k=>isParent()||k.id===me.id).map(k=>{const av=k.stars-pendingCost(k.id);return whoBtn(k,"data-buy",av<r.cost,`★ ${av}`)}).join("")}</div>${!isParent()&&S.settings.approve?`<p class="note">Mom or Dad will approve it before the stars come off.</p>`:""}
   <button class="btn ghost" data-close>Cancel</button>`);
  document.getElementById("scrim").dataset.reward=rewardId;
}
// Confetti
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[];
function burst(n=60,main){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=[main||COLORS[0],"#f5b700","#3b82f6","#12b5a5","#f5487f"];
  const start=!parts.length;
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,r:Math.random()*7+4,c:cols[i%cols.length],l:100,a:Math.random()*6});
  if(start)tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.33;p.l--;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height);
  if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);
}
document.addEventListener("click",e=>{
  const t=e.target;
  const tg=t.closest("[data-toggle]");if(tg){const c=S.chores.find(c=>c.id===tg.dataset.toggle);if(c){c.off=!c.off;save();render();toast(c.off?`${c.name}: turned off`:`${c.name}: back on`)}return}
  const offc=t.closest(".card.off[data-chore]");if(offc){toast("This mission is turned off. Flip it on first.");return}
  const ed=t.closest("[data-editchore]");if(ed){editChore(ed.dataset.editchore);return}
  const wc=t.closest("[data-who]");if(wc){who=wc.dataset.who||null;render();return}
  if(t.closest("#tutBtn")){sheet(`<p class="eyebrow">Parent tutorial</p><h2>How to run the Squad</h2><video id="tutVid" src="parent-tutorial.mp4" controls playsinline preload="metadata"></video><button class="btn ghost" data-close>Close</button>`);return}
  if(t.id==="saveChore"){const c=S.chores.find(c=>c.id===editing);if(c){c.name=document.getElementById("en").value.trim()||c.name;c.xp=Math.max(1,+document.getElementById("ex").value||c.xp);c.area=document.getElementById("ea").value;c.kid=document.getElementById("ek").value||null}save();closeSheet();render();toast("Mission updated");return}
  if(t.id==="delChore"){S.chores=S.chores.filter(c=>c.id!==editing);save();closeSheet();render();toast("Mission removed");return}
  const delr=t.closest("[data-delreward]");if(delr){S.rewards=S.rewards.filter(r=>r.id!==delr.dataset.delreward);save();render();return}
  const tb=t.closest("nav button");if(tb){tab=tb.dataset.tab;render();return}
  if(t.id==="helpBtn"){tab=tab==="about"?"missions":"about";render();scrollTo(0,0);return}
  const go=t.closest("[data-go]");if(go){tab=go.dataset.go;render();scrollTo(0,0);return}
  const sw=t.closest("[data-color]");if(sw){S.kids.find(k=>k.id===sw.dataset.kid).color=sw.dataset.color;save();render();return}
  const em=t.closest("[data-emblem]");if(em){S.kids.find(k=>k.id===em.dataset.kid).emblem=em.dataset.emblem;save();render();return}
  const aw=t.closest("[data-award]");if(aw){const s=document.getElementById("scrim");award(aw.dataset.award,s.dataset.chore,+s.dataset.pts,s.dataset.x2);return}
  const by=t.closest("[data-buy]");if(by){const s=document.getElementById("scrim");buyIt(by.dataset.buy,s.dataset.reward);return}
  const ch=t.closest(".card[data-chore],.motd");if(ch){askWho(ch.dataset.chore,ch.dataset.x2);return}
  const rw=t.closest(".card[data-reward]");if(rw){buy(rw.dataset.reward);return}
  if(t.closest("[data-close]")||t.id==="scrim"){closeSheet();return}
  if(t.id==="parentBtn"){parent=!parent;render();return}
  if(t.closest("#pinChange")){settingsSheet();return}
  if(t.id==="meBtn"){logout();return}
  if(t.closest("#setupBtn")){pinTarget={id:"dad",name:"Dad"};pinCtx="setup";pinSheet("set1");return}
  const lg=t.closest("[data-login]");if(lg){const p=ROSTER.find(p=>p.id===lg.dataset.login);pinTarget=p;pinCtx="login";pinSheet("login");return}
  const sp=t.closest("[data-setpin]");if(sp){const p=people().find(p=>p.id===sp.dataset.setpin);pinTarget=p;pinCtx="set";pinSheet("set1");return}
  if(t.closest("#apTgl")){act("settings",{approve:!S.settings.approve}).then(r=>{if(r){settingsSheet();toast(S.settings.approve?"Parent approval is on":"Parent approval is off")}});return}
  const ap=t.closest("[data-approve]");if(ap){ap.disabled=true;act("approve",{id:ap.dataset.approve}).then(r=>{if(r)toast("Approved. Stars sent!")});return}
  const dn=t.closest("[data-deny]");if(dn){dn.disabled=true;act("deny",{id:dn.dataset.deny}).then(r=>{if(r)toast("Sent back. They can try again.")});return}
  const pk=t.closest("[data-key]");if(pk){pinKey(pk.dataset.key);return}
  if(t.id==="undo"){act("undo").then(r=>{if(r)toast("Undone: "+r.result.text)});return}
  if(t.id==="reset"){sheet(`<h2>Reset every star, patch and the log?</h2><p class="note">Names, colors, missions and rewards stay. This can't be undone.</p><div class="addform"><button class="btn warn" id="resetYes">Reset stars</button><button class="btn ghost" data-close>Keep them</button></div>`);return}
  if(t.id==="resetYes"){closeSheet();act("reset").then(r=>{if(r)toast("Fresh start for the squad!")});return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="addChore")S.chores.push({id:"c"+Date.now(),name:document.getElementById("cn").value.trim(),xp:Math.max(1,+document.getElementById("cx").value||10),area:document.getElementById("ca").value,kid:document.getElementById("ck").value||null});
  if(e.target.id==="addReward")S.rewards.push({id:"r"+Date.now(),name:document.getElementById("rn").value.trim(),cost:Math.max(1,+document.getElementById("rc").value||50)});
  save();render();
});
document.addEventListener("change",e=>{const id=e.target.dataset.name;if(id){const k=S.kids.find(k=>k.id===id);k.name=e.target.value.trim()||k.name;save();render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();else if(pinMode&&document.getElementById("pinDots")){if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==="Backspace")pinKey("back")}});
boot();
</script>
